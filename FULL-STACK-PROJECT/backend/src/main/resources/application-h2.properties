# ============================================================
# H2 PROFILE - run the project WITHOUT installing MySQL
# Start with:  mvn spring-boot:run -Dspring-boot.run.profiles=h2
# Data lives in memory, so it resets every time you stop the app.
# ============================================================
spring.datasource.url=jdbc:h2:mem:hospital_db;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop

# Browser database viewer: http://localhost:8080/h2-console
# JDBC URL to type there: jdbc:h2:mem:hospital_db   (user: sa, password empty)
spring.h2.console.enabled=true
