# ============================================================
# MAIN SETTINGS (uses MySQL)
# ============================================================
server.port=8080

# --- Database (MySQL) ---
# "createDatabaseIfNotExist=true" means MySQL will create hospital_db for you automatically.
spring.datasource.url=jdbc:mysql://localhost:3306/hospital_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
# Change "root" below to YOUR MySQL password (or set the DB_PASSWORD environment variable)
spring.datasource.password=${DB_PASSWORD:root}

# --- JPA / Hibernate ---
# "update" = create the tables automatically if they do not exist yet.
spring.jpa.hibernate.ddl-auto=update
# Print the SQL that Hibernate runs, so you can SEE what happens behind the scenes.
spring.jpa.show-sql=true

# --- JWT (login token) settings ---
# Secret must be at least 32 characters. Change it for a real project.
app.jwt.secret=this-is-a-demo-secret-key-change-it-1234567890
# Token valid for 24 hours (in milliseconds)
app.jwt.expiration-ms=86400000
