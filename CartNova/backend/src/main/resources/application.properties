server.port=8080

# ---- MySQL (change user/password or set env vars DB_USER / DB_PASS) ----
spring.datasource.url=jdbc:mysql://localhost:3306/cartnova?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:root}

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ---- JWT (secret must be 32+ characters; override with env var JWT_SECRET in production) ----
jwt.secret=${JWT_SECRET:cartnova-demo-secret-key-change-me-please-123456}
jwt.expiration-ms=86400000
