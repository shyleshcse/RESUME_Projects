function acc(){if(!U){setTimeout(()=>modal('login'),50);return'<div class="w"><h2>Please login</h2></div>'}const j=jwt(U.token),mo=S.orders.filter(o=>o.uid==U.id),A=AL();return`<div class="w" style="padding-top:24px;max-width:900px"><div class="card" style="padding:22px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:16px">${U.img?`<img src="${U.img}" style="width:76px;border-radius:50%;background:var(--bg)">`:'<div style="font-size:54px">👤</div>'}<div style="flex:1;min-width:180px"><h2 style="margin:0">${esc(U.name)}</h2><small style="color:var(--m)">${esc(U.email||'')} · <span class="bd2">${U.role}</span></small></div><button class="btn o s" onclick="go('orders')">📦 Orders</button><button class="btn o s" onclick="go('wish')">♥ Wishlist</button><button class="btn r s" onclick="logout()">⏻ Logout</button></div><div class="st"><div><b>${mo.length}</b><span>Orders</span></div><div><b>${S.wish.length}</b><span>Wishlist</span></div><div><b>${A.length}</b><span>Saved addresses</span></div><div><b>${inr(mo.filter(o=>!o.cx).reduce((s,o)=>s+o.t.total,0))}</b><span>Total spent</span></div></div><div class="card" style="margin-bottom:16px"><div class="row" style="margin:0 0 14px"><div><h3 style="margin:0">📍 Saved Addresses</h3><small style="color:var(--m)">Save once, order faster every time ⚡</small></div><button class="btn s" onclick="adm()">+ Add new address</button></div><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(260px,1fr))">${A.map(adc).join('')||'<p style="color:var(--m)">No saved addresses yet. Add one and checkout will fill it for you.</p>'}</div></div><details class="card"><summary><b>🔑 Session token (JWT)</b></summary><br><textarea rows="3" readonly style="font-size:11px">${esc(U.token)}</textarea><small style="color:var(--m)">Decoded: ${esc(JSON.stringify(j))}</small></details></div>`}

render();load();loadHome();
